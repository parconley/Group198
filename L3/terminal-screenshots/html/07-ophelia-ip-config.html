<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ophelia IP Configuration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fdf6e3;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }
        .terminal {
            background: #fdf6e3;
            border: none;
            border-radius: 0;
            padding: 2px;
            font-family: 'Ubuntu Mono', 'Courier New', monospace;
            font-size: 15px;
            line-height: 1.5;
            color: #657b83;
            white-space: pre-wrap;
            word-wrap: break-word;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="terminal">pconley1@ophelia:~$ ip addr show
3: eth1: &lt;BROADCAST,MULTICAST,UP,LOWER_UP&gt; mtu 1500 qdisc fq_codel state UP group default qlen 1000
    link/ether 02:d0:83:3e:8a:f7 brd ff:ff:ff:ff:ff:ff
    inet 10.0.0.103/24 brd 10.0.0.255 scope global eth1</div>
</body>
</html>
